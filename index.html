<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>BMC Client</title>
  <link rel="icon" type="image/png" href="https://drive.google.com/uc?export=view&id=1X9y5kWzxDKyLmMcYUj894XxR3K7Gxs69">

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden; /* Biar ga ada scrollbar */
      background-color: #0d1117; /* Warna background gelap biar pas loading ga silau */
    }
    iframe {
      border: none;
      width: 100vw;
      height: 100vh;
      display: block;
    }
  </style>
</head>
<body>

  <!--
    allow="geolocation; camera": WAJIB ada supaya Permissions Policy browser
    (terutama di HP) tidak memblokir akses lokasi & kamera untuk konten di
    dalam iframe ini. Tanpa atribut ini, permintaan navigator.geolocation
    dari halaman script.google.com (yang di-iframe di domain Vercel yang
    berbeda) akan DITOLAK OTOMATIS oleh browser tanpa dialog izin sama
    sekali -- persis gejala "lokasi tidak dapat diambil".
  -->
  <iframe
    src="https://script.google.com/macros/s/AKfycbw3qNyMnYng18t3Dv477IElv629LwULxkB8zT60V9x1FxeUrfcUv88xABqtxZP250HK/exec"
    allow="geolocation *; camera *"
  ></iframe>

</body>
</html>
